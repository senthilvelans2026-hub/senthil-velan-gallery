<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senthil Velan Gallery</title>
<style>
:root{--bg:#fafafa;--fg:#111;--mut:#888}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--fg:#eee;--mut:#777}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:28px 24px 4px;font-size:1.3rem;font-weight:600}
section{padding:16px 0 8px}
h2{margin:0 24px 10px;font-size:1rem;font-weight:500}
h2 span{color:var(--mut);font-size:.85rem;margin-left:6px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 24px 12px;scroll-snap-type:x proximity}
.item{flex:0 0 auto;height:260px;scroll-snap-align:start;border-radius:8px;overflow:hidden;background:#8882}
.item img,.item video{height:100%;width:auto;display:block;cursor:zoom-in}
.item video{cursor:auto;max-width:80vw}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:96vw;max-height:96vh}
</style></head><body>
<header>Senthil Velan Gallery</header>
<section><h2>AI + Design <span>3</span></h2><div class="row">
<div class="item"><img src="AI%20%2B%20Design/Gemini_Generated_Image_4kwkth4kwkth4kwk.png" loading="lazy" alt="Gemini_Generated_Image_4kwkth4kwkth4kwk.png"></div>
<div class="item"><img src="AI%20%2B%20Design/Gemini_Generated_Image_85bh8985bh8985bh.png" loading="lazy" alt="Gemini_Generated_Image_85bh8985bh8985bh.png"></div>
<div class="item"><img src="AI%20%2B%20Design/Gemini_Generated_Image_d2h68xd2h68xdh6.png" loading="lazy" alt="Gemini_Generated_Image_d2h68xd2h68xdh6.png"></div>
</div></section>
<section><h2>Images <span>11</span></h2><div class="row">
<div class="item"><img src="Images/2.png" loading="lazy" alt="2.png"></div>
<div class="item"><img src="Images/6.png" loading="lazy" alt="6.png"></div>
<div class="item"><img src="Images/corrected%20intach%20poster%2016%20%3B%2044.jpg" loading="lazy" alt="corrected intach poster 16 ; 44.jpg"></div>
<div class="item"><img src="Images/dAaY%2004.png" loading="lazy" alt="dAaY 04.png"></div>
<div class="item"><img src="Images/Day%2004.png" loading="lazy" alt="Day 04.png"></div>
<div class="item"><img src="Images/Page%205.1%20(3).jpg" loading="lazy" alt="Page 5.1 (3).jpg"></div>
<div class="item"><video src="Images/Pallavan%20Post%20001.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><img src="Images/PG%204.png" loading="lazy" alt="PG 4.png"></div>
<div class="item"><img src="Images/PG%205.png" loading="lazy" alt="PG 5.png"></div>
<div class="item"><video src="Images/QR%20Post.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><img src="Images/streak%20street.jpg" loading="lazy" alt="streak street.jpg"></div>
</div></section>
<section><h2>Videos <span>8</span></h2><div class="row">
<div class="item"><video src="Videos/2D%20Animation%20Promo.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/Anamorphic%20Single%20Screen.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/Chemical%20Guys%20Task%203%20v1.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/dAY%2009.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/Day%2029.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/Low%20Quality%20Reel%20v3.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/Test%20Task%201%20v6.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
<div class="item"><video src="Videos/Video.mp4#t=0.1" controls preload="metadata" playsinline></video></div>
</div></section>
<div id="lb"><img alt=""></div>
<script>
const lb=document.getElementById('lb'),li=lb.querySelector('img');
document.querySelectorAll('.item img').forEach(i=>i.addEventListener('click',()=>{li.src=i.src;lb.style.display='flex'}));
lb.addEventListener('click',()=>{lb.style.display='none';li.src=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.click()});
</script>
</body></html>
